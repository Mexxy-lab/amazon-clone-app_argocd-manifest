apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mexxy-lab/amazon-clone-app_argocd-manifest.git
    targetRevision: main
    path: kubernetes/argocd-ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
