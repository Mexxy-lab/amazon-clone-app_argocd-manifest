deployment:
  enabled: true
  kind: Deployment
  replicas: 1

service:
  enabled: true
  single: true
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    nodePort: 30080
    protocol: TCP

  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    nodePort: 30443
    protocol: TCP

  traefik:
    expose:
      default: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector:
  kubernetes.io/hostname: worker-node1
