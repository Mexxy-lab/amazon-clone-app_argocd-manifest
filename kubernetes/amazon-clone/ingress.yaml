
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amazon-clone-ingress
  namespace: amazon-clone
spec:
  ingressClassName: traefik

  rules:
    - host: amazon.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amazon-clone-service
                port:
                  number: 80
