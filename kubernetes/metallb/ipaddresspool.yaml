apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: host-only-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.3.0.100-10.3.0.110
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: host-only-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - host-only-pool
  interfaces:
    - enp0s9
