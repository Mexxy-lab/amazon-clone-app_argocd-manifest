# Argo CD Helm chart configuration
# Chart: 7.8.28
# Argo CD: v2.14.11

crds:
  install: false
  keep: true

configs:
  cm:
    application.resourceTrackingMethod: annotation

    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      if obj.spec == nil or obj.spec.rules == nil or #obj.spec.rules == 0 then
        hs.status = "Progressing"
        hs.message = "Ingress has no routing rules"
        return hs
      end

      hs.status = "Healthy"
      hs.message = "Ingress has routing rules; load balancer status is not required for this Traefik NodePort setup"
      return hs

  params:
    server.insecure: true

# Expose Argo CD through the existing Traefik instance.
extraObjects:
  # Argo CD HTTP route.
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-ingress-http
      namespace: argocd
    spec:
      entryPoints:
        - web
      routes:
        - match: Host(`argocd.test`)
          kind: Rule
          services:
            - name: argocd-platform-server
              port: 80
              scheme: http

  # Argo CD HTTPS route.
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-ingress-https
      namespace: argocd
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`argocd.test`)
          kind: Rule
          services:
            - name: argocd-platform-server
              port: 80
              scheme: http
      tls:
        secretName: argocd-server-tls
  # Bootstrap issuer: allows cert-manager to create our root CA.
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: local-ca-bootstrap
    spec:
      selfSigned: {}

  # Root CA certificate and private key.
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: local-root-ca
      namespace: cert-manager
    spec:
      isCA: true
      commonName: Pumej Local Lab Root CA
      secretName: local-ca-key-pair
      duration: 87600h
      privateKey:
        algorithm: RSA
        size: 4096
      issuerRef:
        name: local-ca-bootstrap
        kind: ClusterIssuer
        group: cert-manager.io

  # Issuer that signs application certificates using our root CA.
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: local-ca-issuer
    spec:
      ca:
        secretName: local-ca-key-pair

  # Argo CD HTTPS certificate.
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: argocd-server-certificate
      namespace: argocd
    spec:
      secretName: argocd-server-tls
      issuerRef:
        name: local-ca-issuer
        kind: ClusterIssuer
        group: cert-manager.io
      dnsNames:
        - argocd.test
