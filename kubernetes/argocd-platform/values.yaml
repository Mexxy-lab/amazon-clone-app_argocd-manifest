# Argo CD Helm chart configuration
# Chart: 7.8.28
# Argo CD: v2.14.11

crds:
  install: true
  keep: true

configs:
  params:
    server.insecure: true

# Expose Argo CD through the existing Traefik instance.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-ingress
      namespace: argocd
    spec:
      entryPoints:
        - web
      routes:
        - match: Host(`argocd.test`)
          kind: Rule
          services:
            - name: argocd-server
              port: 80
              scheme: http
