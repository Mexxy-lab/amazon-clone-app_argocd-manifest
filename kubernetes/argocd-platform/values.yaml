# Argo CD Helm chart configuration
# Chart: 7.8.28
# Argo CD: v2.14.11

crds:
  install: false
  keep: true

configs:
  cm:
    application.resourceTrackingMethod: annotation

    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      if obj.spec == nil or obj.spec.rules == nil or #obj.spec.rules == 0 then
        hs.status = "Progressing"
        hs.message = "Ingress has no routing rules"
        return hs
      end

      hs.status = "Healthy"
      hs.message = "Ingress has routing rules; load balancer status is not required for this Traefik NodePort setup"
      return hs

  params:
    server.insecure: true

# Expose Argo CD through the existing Traefik instance.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: argocd-ingress
      namespace: argocd
    spec:
      entryPoints:
        - web
      routes:
        - match: Host(`argocd.test`)
          kind: Rule
          services:
            - name: argocd-platform-server
              port: 80
              scheme: http
